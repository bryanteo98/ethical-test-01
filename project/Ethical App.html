<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Ethical — An Entrepreneurial Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:        #f3f3e9;
    --cream-2:      #ece9dc;
    --dark:         #2e2e2e;
    --near-black:   #231f20;
    --ink:          #46423f;
    --orange:       #ff5500;
    --orange-deep:  #e84800;
    --muted:        rgba(46,46,46,0.5);
    --muted-2:      rgba(46,46,46,0.35);
    --hairline:     rgba(46,46,46,0.14);
    --hairline-on-orange: rgba(243,243,233,0.28);
    --hairline-on-dark:   rgba(243,243,233,0.16);
  }

  html, body { height: 100%; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: var(--cream);
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  ::selection { background: var(--orange); color: var(--cream); }

  /* Big serif uses DM Serif Display as a Caslon-adjacent web fallback */
  .serif {
    font-family: 'DM Serif Display', 'Big Caslon CC', 'Big Caslon', 'Hoefler Text', Georgia, serif;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  /* App scales to fit viewport while preserving 1440 baseline */
  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--dark);
  }
  #scaler {
    width: 1440px;
    height: 900px;
    transform-origin: center center;
    background: var(--cream);
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
  }

  /* Top demo nav (compact, bottom-anchored to not steal hero space) */
  .demo-nav {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 5px;
    background: rgba(35,31,32,0.92);
    color: rgba(243,243,233,0.85);
    backdrop-filter: blur(6px);
    border-radius: 999px;
  }
  .demo-nav button {
    appearance: none;
    background: transparent;
    color: rgba(243,243,233,0.65);
    border: 0;
    font: 600 11px/1 'Manrope', sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
  }
  .demo-nav button:hover { color: var(--cream); }
  .demo-nav button.active {
    background: var(--orange);
    color: var(--cream);
  }

  /* Page transitions */
  .page {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.36s ease;
  }
  .page.active { opacity: 1; pointer-events: auto; }

  /* ─────── Logo / asterisk ─────── */
  .logo-row { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .asterisk {
    width: 16px; height: 16px; flex: 0 0 16px;
    color: var(--orange);
    display: inline-block;
  }
  .logo-word {
    font-family: 'DM Serif Display', 'Big Caslon CC', serif;
    font-size: 22px; line-height: 1; letter-spacing: -0.01em;
    color: var(--dark);
  }

  /* ─────── LANDING ─────── */
  .landing { background: var(--cream); }

  .nav {
    position: absolute; left: 0; right: 0; top: 0;
    height: 64px; padding: 0 31px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 5;
  }
  .nav-actions { display: flex; gap: 12px; }
  .btn {
    height: 32px; padding: 0 18px;
    font: 700 13px/1 'Manrope', sans-serif;
    letter-spacing: 0.005em;
    border: 1px solid var(--dark);
    background: transparent; color: var(--dark);
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 0;
  }
  .btn:hover { background: var(--dark); color: var(--cream); border-color: var(--dark); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--near-black); color: var(--cream); border-color: var(--near-black); }
  .btn.primary:hover { background: var(--orange); border-color: var(--orange); color: var(--cream); }

  .hero-tagline {
    position: absolute; left: 32px; top: 89px;
    width: 400px;
    font: 500 13px/1.4 'Manrope', sans-serif;
    color: var(--near-black);
    white-space: pre-line;
  }
  .hero-collective {
    position: absolute; right: 24px; top: 89px;
    width: 200px;
    font: 700 13px/1.4 'Manrope', sans-serif;
    color: rgba(35,31,32,0.6);
    text-align: right;
  }

  /* ─────────── Ticket region (Figma exact: 1440×900) ─────────── */
  /* Main ticket (1185×404) + tail (200×404), absolutely positioned in Figma coords. */
  .ticket-main {
    position: absolute;
    left: 31px; top: 450px;
    width: 1185px; height: 404px;
    background: var(--orange);
    clip-path: polygon(
      24px 0,
      1161px 0,
      1185px 32px,
      1185px calc(100% - 32px),
      1161px 100%,
      24px 100%,
      0 calc(100% - 32px),
      0 32px
    );
    overflow: hidden;
  }
  /* "Ethical" wordmark cutout — cream-colored text aligned to look like a hole */
  .ticket-wordmark {
    position: absolute;
    left: 0; right: 0; bottom: -34px;
    text-align: center;
    font: 400 410px/0.85 'DM Serif Display', 'Big Caslon CC', serif;
    letter-spacing: -0.02em;
    color: var(--cream);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
  .ticket-main object,
  .ticket-main img {
    width: 100%; height: 100%;
    display: block;
    user-select: none; pointer-events: none;
  }
  /* Tail — a separate orange chamfered shape on the right (200×404 @ left:1216) */
  .ticket-tail {
    position: absolute;
    left: 1216px; top: 450px;
    width: 200px; height: 404px;
    background: var(--orange);
    clip-path: polygon(
      24px 0,
      176px 0,
      200px 32px,
      200px calc(100% - 32px),
      176px 100%,
      24px 100%,
      0 calc(100% - 32px),
      0 32px
    );
  }
  /* Asterisk decoration on tail */
  .tail-asterisk {
    position: absolute;
    left: 1308px; top: 644px;
    width: 16px; height: 16px;
    color: var(--cream);
    opacity: 0.75;
  }

  /* Stats row inside main ticket: top:480, left aligned by 4 columns */
  .stats-row {
    position: absolute;
    left: 0; top: 480px;
    width: 1185px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    z-index: 2;
    color: var(--cream);
  }
  .stat-cell {
    position: relative;
    padding: 0 56px;
  }
  .stat-cell + .stat-cell::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 1px;
    background-image: linear-gradient(to bottom, rgba(243,243,233,0.55) 0 4px, transparent 4px 9px);
    background-size: 1px 9px;
    background-repeat: repeat-y;
  }
  .stat-num {
    font: 700 38px/1 'Manrope', sans-serif;
    letter-spacing: -0.01em;
    color: var(--cream);
  }
  .stat-label {
    margin-top: 8px;
    font: 500 13px/1 'Manrope', sans-serif;
    color: var(--cream);
  }
  /* horizontal dotted divider under stats (Figma Line3 ×5) */
  .stats-divider {
    position: absolute;
    left: 31px;
    top: 580px;
    width: 1185px;
    height: 1px;
    background-image: linear-gradient(to right, rgba(243,243,233,0.5) 0 6px, transparent 6px 14px);
    background-size: 14px 1px;
    z-index: 2;
  }

  /* Right-side block on main ticket: emblem circle + 'More than a network' */
  .ticket-emblem-wrap {
    position: absolute;
    left: 1134px; top: 468px;
    width: 63px; height: 63px;
    border-radius: 50%;
    border: 1px solid rgba(243,243,233,0.6);
    display: grid; place-items: center;
    overflow: hidden;
    z-index: 3;
  }
  .ticket-emblem-wrap img { width: 44px; height: 44px; object-fit: contain; filter: brightness(0) invert(1); display: block; }
  .ticket-emblem-wrap svg { width: 42px; height: 42px; color: var(--cream); }
  .ticket-tagline {
    position: absolute;
    left: 945px; top: 562px;
    font: 500 13px/1 'Manrope', sans-serif;
    color: var(--cream);
    z-index: 2;
  }

  /* ─────── AUTH (Login + Register) ─────── */
  .auth { display: flex; height: 100%; }

  .auth-left {
    width: 480px;
    height: 100%;
    background: var(--dark);
    color: var(--cream);
    padding: 48px 48px;
    display: flex; flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .auth-left .logo-word { color: var(--cream); }
  .auth-left .more-than {
    margin-top: 6px;
    font: 700 9px/1 'Manrope', sans-serif;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(243,243,233,0.5);
    padding-left: 26px;
  }

  .auth-left .heading-block {
    margin-top: auto;
    margin-bottom: auto;
  }
  .auth-left h1 {
    font-family: 'DM Serif Display', 'Big Caslon CC', serif;
    font-weight: 400;
    font-size: 52px; line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--cream);
  }
  .auth-left h1 .it { font-style: italic; }
  .auth-left .lede {
    margin-top: 14px;
    font: 400 13px/1.55 'Manrope', sans-serif;
    color: rgba(243,243,233,0.55);
    max-width: 280px;
  }

  .auth-left .tiers {
    margin-top: auto;
    padding-top: 32px;
    border-top: 1px solid var(--hairline-on-dark);
  }
  .tier {
    display: grid; grid-template-columns: 36px 1fr; gap: 0 8px;
    padding: 12px 0;
    border-bottom: 1px dashed rgba(243,243,233,0.1);
  }
  .tier:last-child { border-bottom: 0; }
  .tier .num {
    font: 600 11px/1.4 'Manrope', sans-serif;
    color: rgba(243,243,233,0.45);
    letter-spacing: 0.04em;
  }
  .tier .name {
    font: 600 13px/1.4 'Manrope', sans-serif;
    color: var(--cream);
  }
  .tier .desc {
    grid-column: 2 / 3;
    margin-top: 4px;
    font: 400 12px/1.5 'Manrope', sans-serif;
    color: rgba(243,243,233,0.5);
  }

  .auth-left .footnote {
    position: absolute;
    bottom: 32px; left: 48px; right: 48px;
    display: flex; justify-content: space-between; align-items: center;
    font: 500 10px/1 'Manrope', sans-serif;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(243,243,233,0.35);
  }

  .auth-right {
    flex: 1;
    height: 100%;
    background: var(--cream);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Decorative emblem watermark on right */
  .emblem-watermark {
    position: absolute;
    right: -80px; top: 50%;
    transform: translateY(-50%);
    width: 567px; height: 567px;
    opacity: 0.18;
    pointer-events: none;
    user-select: none;
  }
  .emblem-watermark img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0); }

  .auth-form {
    width: 400px;
    position: relative; z-index: 2;
  }
  .auth-form.wide { width: 460px; }

  .form-eyebrow {
    font: 700 9px/1 'Manrope', sans-serif;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 18px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .form-eyebrow .dot { width: 6px; height: 6px; background: var(--orange); border-radius: 50%; display: inline-block; }
  .auth-form h2 {
    font-family: 'DM Serif Display', 'Big Caslon CC', serif;
    font-weight: 400;
    font-size: 42px; line-height: 1; letter-spacing: -0.02em;
    color: var(--dark);
  }
  .auth-form .sub {
    margin-top: 10px;
    font: 400 13px/1.5 'Manrope', sans-serif;
    color: var(--muted);
  }

  /* Tabs */
  .tabs {
    margin: 28px 0 18px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    background: rgba(46,46,46,0.06);
    padding: 4px;
    border-radius: 0;
  }
  .tab {
    appearance: none; border: 0; background: transparent;
    font: 700 13px/1 'Manrope', sans-serif;
    color: var(--muted);
    height: 40px; cursor: pointer;
    letter-spacing: 0.01em;
    transition: background 0.2s, color 0.2s;
  }
  .tab.active { background: var(--dark); color: var(--cream); }
  .tab:not(.active):hover { color: var(--dark); }

  /* Fields */
  .field-group { margin-top: 16px; }
  .field-label {
    display: flex; align-items: center; justify-content: space-between;
    font: 700 9px/1 'Manrope', sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(46,46,46,0.55);
    margin-bottom: 8px;
  }
  .field-label .req { color: var(--orange); }
  .field {
    position: relative;
    display: flex; align-items: center;
    height: 44px;
    background: var(--cream);
    border: 1px solid var(--dark);
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .field:focus-within {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255,85,0,0.12);
  }
  .field.error { border-color: var(--orange-deep); }
  .field input {
    flex: 1; height: 100%;
    padding: 0 16px;
    background: transparent;
    border: 0; outline: 0;
    font: 400 13px/1 'Manrope', sans-serif;
    color: var(--dark);
  }
  .field input::placeholder { color: var(--muted-2); }
  .field .togpw {
    appearance: none; border: 0; background: transparent;
    color: var(--muted);
    padding: 0 14px; height: 100%;
    cursor: pointer;
    font: 700 9px/1 'Manrope', sans-serif;
    letter-spacing: 0.18em;
  }
  .field .togpw:hover { color: var(--dark); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .field-error {
    margin-top: 6px;
    font: 500 11px/1.4 'Manrope', sans-serif;
    color: var(--orange-deep);
    display: none;
  }
  .field-error.show { display: block; }

  .submit {
    margin-top: 24px;
    width: 100%; height: 48px;
    background: var(--dark); color: var(--cream);
    border: 0; cursor: pointer;
    font: 700 13px/1 'Manrope', sans-serif;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: background 0.2s, transform 0.1s;
  }
  .submit:hover { background: var(--orange); }
  .submit:active { transform: translateY(1px); }
  .submit.loading { background: var(--orange-deep); pointer-events: none; }
  .submit .arrow { display: inline-block; transition: transform 0.25s; }
  .submit:hover .arrow { transform: translateX(3px); }

  .submit-helper {
    margin-top: 16px;
    font: 400 12px/1.5 'Manrope', sans-serif;
    color: var(--muted);
  }
  .submit-helper a {
    color: var(--orange); font-weight: 700;
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    padding-bottom: 1px;
  }
  .submit-helper a:hover { color: var(--orange-deep); }

  /* Success toast */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translate(-50%, 20px);
    background: var(--dark); color: var(--cream);
    padding: 12px 20px;
    font: 600 12px/1 'Manrope', sans-serif;
    letter-spacing: 0.04em;
    border: 1px solid var(--orange);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    display: inline-flex; gap: 10px; align-items: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--orange);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* page-aware corner timestamp */
  .corner-meta {
    position: absolute;
    left: 32px; bottom: 24px;
    font: 500 10px/1 'Manrope', sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(46,46,46,0.4);
    z-index: 4;
  }
  .corner-meta .blink {
    display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--orange);
    margin-right: 8px; vertical-align: 1px;
    animation: pulse 1.6s infinite;
  }

  /* Tier hover */
  .tier { cursor: default; transition: background 0.2s; }
  .tier:hover { background: rgba(243,243,233,0.04); }

  /* ════════════ DASHBOARDS ════════════ */
  .app { display: flex; height: 100%; background: var(--dark); color: var(--cream); }

  /* Sidebar */
  .sidebar {
    width: 240px; flex: 0 0 240px;
    height: 100%;
    background: var(--dark);
    border-right: 1px solid rgba(243,243,233,0.06);
    display: flex; flex-direction: column;
    padding-top: 18px;
    position: relative;
  }
  .sb-brand { padding: 0 24px 18px; border-bottom: 1px solid rgba(243,243,233,0.06); }
  .sb-brand .logo-word { color: var(--cream); }
  .sb-brand .more-than {
    margin-top: 4px;
    font: 700 9px/1 'Manrope', sans-serif;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(243,243,233,0.4);
    padding-left: 26px;
  }

  .sb-user {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 24px;
    border-bottom: 1px solid rgba(243,243,233,0.06);
  }
  .sb-avatar {
    width: 32px; height: 32px;
    background: var(--orange);
    color: var(--cream);
    display: grid; place-items: center;
    font: 700 13px/1 'Manrope', sans-serif;
  }
  .sb-user .nm { font: 600 13px/1.2 'Manrope', sans-serif; color: var(--cream); }
  .sb-user .role { font: 500 10px/1 'Manrope', sans-serif; color: rgba(243,243,233,0.45); margin-top: 4px; letter-spacing: 0.04em; text-transform: lowercase; }
  .sb-user .tier {
    margin-left: auto;
    font: 700 8px/1 'Manrope', sans-serif;
    color: var(--orange);
    background: rgba(255,85,0,0.15);
    padding: 4px 8px;
    letter-spacing: 0.12em;
  }

  .sb-nav { padding: 16px 0; flex: 1; overflow-y: auto; }
  .sb-item {
    position: relative;
    display: grid; grid-template-columns: 40px 24px 1fr;
    align-items: center;
    height: 40px; padding: 0 24px 0 0;
    cursor: pointer;
    color: rgba(243,243,233,0.55);
    font: 500 13px/1 'Manrope', sans-serif;
    transition: color 0.18s, background 0.18s;
  }
  .sb-item:hover { color: var(--cream); background: rgba(243,243,233,0.03); }
  .sb-item.active { color: var(--cream); background: rgba(243,243,233,0.04); }
  .sb-item.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--orange);
  }
  .sb-item .num {
    font: 600 10px/1 'Manrope', sans-serif;
    color: rgba(243,243,233,0.35);
    text-align: center;
    letter-spacing: 0.04em;
  }
  .sb-item.active .num { color: var(--orange); }
  .sb-item .ic { display: grid; place-items: center; opacity: 0.7; }
  .sb-item.active .ic { opacity: 1; }
  .sb-signout {
    margin-top: auto;
    display: flex; align-items: center; gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid rgba(243,243,233,0.06);
    color: rgba(243,243,233,0.55);
    cursor: pointer;
    font: 500 13px/1 'Manrope', sans-serif;
    transition: color 0.18s;
  }
  .sb-signout:hover { color: var(--orange); }

  /* Main content */
  .main { flex: 1; padding: 56px 32px 32px; overflow-y: auto; position: relative; height: 100%; }
  .main-bell {
    position: absolute; top: 18px; right: 32px;
    width: 32px; height: 32px;
    background: var(--cream-2);
    color: var(--dark);
    display: grid; place-items: center;
    cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    position: absolute;
  }
  .main-bell .badge {

/* ───────── Asterisk SVG ───────── */
const Asterisk = ({size=16, color='currentColor', stroke=2}) => (
  <svg className="asterisk" width={size} height={size} viewBox="0 0 16 16" fill="none" style={{color}}>
    <line x1="8" y1="1" x2="8" y2="15" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round"/>
    <line x1="1" y1="8" x2="15" y2="8" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round"/>
    <line x1="2.93" y1="2.93" x2="13.07" y2="13.07" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round"/>
    <line x1="13.07" y1="2.93" x2="2.93" y2="13.07" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round"/>
  </svg>
);

/* ───────── Engraved-style Emblem (canopy + monogram E) ─────────
   Hand-tuned approximation of the Figma engraving: a curved canopy/parasol
   above a calligraphic E inside two concentric thin circles. Uses many short
   strokes to evoke an etched/engraved feel. Pure SVG, no raster. */
const Emblem = ({stroke="currentColor", weight=0.7}) => {
  // Generate radial hatching strokes for the canopy
  const canopyLines = useMemo(() => {
    const lines = [];
    const cx = 200, cy = 196, r1 = 78, r2 = 130;
    for (let i = 0; i < 64; i++) {
      const a = -Math.PI + (i / 63) * Math.PI; // top half
      const x1 = cx + Math.cos(a) * r1;
      const y1 = cy + Math.sin(a) * r1;
      const x2 = cx + Math.cos(a) * r2;
      const y2 = cy + Math.sin(a) * r2;
      lines.push({x1, y1, x2, y2, op: 0.45 + Math.sin(a) * 0.25});
    }
    return lines;
  }, []);

  return (
    <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      {/* outer rings */}
      <circle cx="200" cy="200" r="194" stroke={stroke} strokeWidth="1"/>
      <circle cx="200" cy="200" r="170" stroke={stroke} strokeWidth="0.6"/>

      {/* canopy outline */}
      <path
        d="M 70 196 Q 200 80 330 196"
        stroke={stroke} strokeWidth={weight + 0.3} fill="none"
      />
      <path
        d="M 70 196 Q 200 200 330 196"
        stroke={stroke} strokeWidth={weight} fill="none" opacity="0.7"
      />
      {/* canopy ribs / hatching */}
      {canopyLines.map((l,i)=>(
        <line key={i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2}
              stroke={stroke} strokeWidth={0.35} opacity={l.op}/>
      ))}

      {/* central handle / stem with curl */}
      <path d="M 200 196 C 198 240, 206 270, 200 300 C 192 320, 178 326, 168 314 C 158 302, 168 290, 184 296"
            stroke={stroke} strokeWidth={weight + 0.4} fill="none"/>
      <circle cx="200" cy="196" r="3" fill={stroke}/>

      {/* tiny finial atop canopy */}
      <line x1="200" y1="80" x2="200" y2="64" stroke={stroke} strokeWidth="1"/>
      <circle cx="200" cy="60" r="2.4" fill={stroke}/>

      {/* monogram E (calligraphic, italic-feel) */}
      <text x="248" y="248"
            fontFamily="DM Serif Display, Big Caslon CC, serif"
            fontStyle="italic" fontSize="120" fontWeight="400"
            fill={stroke} opacity="0.9">E</text>

      {/* compass dots */}
      <circle cx="200" cy="14" r="2.2" fill={stroke}/>
      <circle cx="200" cy="386" r="2.2" fill={stroke}/>
      <circle cx="14" cy="200" r="2.2" fill={stroke}/>
      <circle cx="386" cy="200" r="2.2" fill={stroke}/>

      {/* engraved curve baseline */}
      <path d="M 60 320 Q 200 360 340 320" stroke={stroke} strokeWidth="0.6" fill="none" opacity="0.7"/>
      <path d="M 80 332 Q 200 360 320 332" stroke={stroke} strokeWidth="0.4" fill="none" opacity="0.5"/>
    </svg>
  );
};

    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) e.email = 'Invalid email';
    if (!pw) e.pw = 'Required';
    else if (pw.length < 6) e.pw = 'Min 6 characters';
    return e;
  };

  const onSubmit = (e) => {
    e.preventDefault();
    const err = validate();
    setErrs(err);
    if (Object.keys(err).length) return;
    const acct = DEMO_ACCOUNTS[email.toLowerCase()];
    if (!acct || acct.pw !== pw) {
      setErrs({pw: 'Invalid email or password'});
      return;
    }
    setLoading(true);
    setTimeout(()=>{
      setLoading(false);
      showToast(`Signed in as ${acct.role}`);
      onAuth(acct.role);
    }, 900);
  };

  return (
    <div className="page active">
      <div className="auth">
        <AuthLeft mode="login" setPage={setPage}/>
        <AuthRight tweaks={tweaks}>
          <form className="auth-form" onSubmit={onSubmit} noValidate>
            <div className="form-eyebrow"><span className="dot"></span>Member access</div>
            <h2>Sign In</h2>
            <p className="sub">Enter your credentials to access your account.</p>

            <Field label="Email" name="email" type="email"
              value={email} onChange={setEmail}
              placeholder="ahmad@demo.com" error={errs.email} required/>
            <Field label="Password" name="password" type="password"
              value={pw} onChange={setPw}
              placeholder="••••••••" error={errs.pw} required/>

            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:6, gap:12}}>
              <div style={{font:'500 10px/1.4 Manrope, sans-serif', color:'rgba(46,46,46,0.5)', letterSpacing:'0.04em'}}>
                Demo: <b style={{color:'var(--dark)'}}>ahmad@demo.com</b> · <b style={{color:'var(--dark)'}}>partner@demo.com</b> · <b style={{color:'var(--dark)'}}>admin@demo.com</b> &nbsp;<span style={{color:'rgba(46,46,46,0.4)'}}>(pw: demo123)</span>
              </div>
              <a href="#" onClick={(e)=>{e.preventDefault(); showToast('Reset link sent (demo)');}}
                 style={{font:'600 11px/1 Manrope, sans-serif', color:'var(--muted)', textDecoration:'none', letterSpacing:'0.04em', whiteSpace:'nowrap'}}>
                Forgot password?
              </a>
            </div>

            <button className={`submit ${loading?'loading':''}`} type="submit">
              {loading ? 'Signing in…' : <>Sign In <span className="arrow">→</span></>}
            </button>

            <p className="submit-helper">
              Don't have an account? <a href="#" onClick={(e)=>{e.preventDefault(); setPage('register');}}>Register</a>
            </p>
          </form>
        </AuthRight>
      </div>
    </div>
  );
};

/* ───────── Register page ───────── */
const Register = ({setPage, showToast, tweaks}) => {
  const [role, setRole] = useState('referrer');
  const [name, setName]   = useState('');
  const [email, setEmail] = useState('');
  const [phone, setPhone] = useState('');
  const [pw, setPw]       = useState('');
  const [company, setCompany] = useState('');
  const [errs, setErrs] = useState({});
  const [loading, setLoading] = useState(false);

  const validate = () => {
    const e = {};
    if (!name.trim()) e.name = 'Required';
    if (!email) e.email = 'Required';
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) e.email = 'Invalid email';
    if (!phone) e.phone = 'Required';
    else if (!/^[0-9 +()-]{8,}$/.test(phone)) e.phone = 'Invalid phone';
    if (!pw) e.pw = 'Required';
    else if (pw.length < 6) e.pw = 'Min 6 characters';
    if (role==='partner' && !company.trim()) e.company = 'Required';
    return e;
  };

  const onSubmit = (e) => {
    e.preventDefault();
    const err = validate();
    setErrs(err);
    if (Object.keys(err).length) return;
    setLoading(true);
    setTimeout(()=>{
      setLoading(false);
      showToast(`Application received — review in 24–48h`);
    }, 1200);
  };

  return (
    <div className="page active">
      <div className="auth">
        <AuthLeft mode="register" setPage={setPage}/>
        <AuthRight tweaks={tweaks}>
          <form className="auth-form wide" onSubmit={onSubmit} noValidate>
            <div className="form-eyebrow"><span className="dot"></span>New application</div>
            <h2>Create Account</h2>
            <p className="sub">Choose your role to get started — you can switch later in settings.</p>

            <div className="tabs" role="tablist">
              <button type="button" role="tab" aria-selected={role==='referrer'}
                className={`tab ${role==='referrer'?'active':''}`}
                onClick={()=>setRole('referrer')}>Referrer</button>
              <button type="button" role="tab" aria-selected={role==='partner'}
                className={`tab ${role==='partner'?'active':''}`}
                onClick={()=>setRole('partner')}>Partner</button>
            </div>

            <div className="field-row">
              <Field label="Full Name" name="name"
                value={name} onChange={setName}
                placeholder={role==='referrer'?'Ahmad Rizal':'Director of Operations'}
                error={errs.name} required/>
              <Field label="Email" name="email" type="email"
                value={email} onChange={setEmail}
                placeholder="ahmad@email.com" error={errs.email} required/>
            </div>

            <div className="field-row">
              <Field label="Phone" name="phone" type="tel"
                value={phone} onChange={setPhone}
                placeholder="0123456789" error={errs.phone} required/>
              <Field label="Password" name="password" type="password"
                value={pw} onChange={setPw}
                placeholder="••••••••" error={errs.pw} required/>
            </div>

            {role==='partner' && (
              <Field label="Company" name="company"
                value={company} onChange={setCompany}
                placeholder="TechVision Sdn Bhd"
                error={errs.company} required/>
            )}

            <button className={`submit ${loading?'loading':''}`} type="submit">
              {loading ? 'Submitting…' : <>Create Account <span className="arrow">→</span></>}
            </button>

            <p className="submit-helper">
              Already have an account? <a href="#" onClick={(e)=>{e.preventDefault(); setPage('login');}}>Sign In</a>
            </p>
          </form>
        </AuthRight>
      </div>
    </div>
  );
};

/* ───────── App ───────── */
const App = () => {
  const [page, setPage] = useState('landing');
  const [toast, setToast] = useState(null);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(()=>setToast(null), 2400);
  };

  // simple key shortcuts
  useEffect(()=>{
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === '1') setPage('landing');
      if (e.key === '2') setPage('login');
      if (e.key === '3') setPage('register');
      if (e.key === '4') setPage('referrer');
      if (e.key === '5') setPage('partner');
      if (e.key === '6') setPage('admin');
    };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  },[]);

  return (
    <>
      {page==='landing'  && <Landing setPage={setPage}/>}
      {page==='login'    && <Login setPage={setPage} showToast={showToast} onAuth={(role)=>setPage(role)} tweaks={tweaks}/>}
      {page==='register' && <Register setPage={setPage} showToast={showToast} tweaks={tweaks}/>}
      {page==='referrer' && <ReferrerApp onSignOut={()=>{showToast('Signed out'); setPage('landing');}} showToast={showToast}/>}
      {page==='partner'  && <PartnerApp  onSignOut={()=>{showToast('Signed out'); setPage('landing');}} showToast={showToast}/>}
      {page==='admin'    && <AdminApp    onSignOut={()=>{showToast('Signed out'); setPage('landing');}} showToast={showToast}/>}

      <DemoNav page={page} setPage={setPage}/>

      {(page==='login' || page==='register') && (
        <TweaksPanel title="Tweaks">
          <TweakSection label="Background Logo"/>
          <TweakSlider label="X position" value={tweaks.logoX} min={-200} max={1400} unit="px"
            onChange={(v)=>setTweak('logoX', v)}/>
          <TweakSlider label="Y offset" value={tweaks.logoY} min={-400} max={400} unit="px"
            onChange={(v)=>setTweak('logoY', v)}/>
          <TweakSlider label="Size" value={tweaks.logoSize} min={200} max={1000} unit="px"
            onChange={(v)=>setTweak('logoSize', v)}/>
          <TweakSlider label="Opacity" value={Math.round(tweaks.logoOpacity*100)} min={0} max={100} unit="%"
            onChange={(v)=>setTweak('logoOpacity', v/100)}/>
        </TweaksPanel>
      )}

      <div className={`toast ${toast?'show':''}`}>
        <span className="dot"></span>{toast}
      </div>
    </>
  );
};

// Expose components needed by dashboards.jsx
Object.assign(window, { Asterisk, Field, useState, useEffect, useMemo });

// Render after dashboards.jsx has loaded (it attaches ReferrerApp/PartnerApp/AdminApp to window)
const tryRender = () => {
  if (window.ReferrerApp && window.PartnerApp && window.AdminApp) {
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  } else {
    setTimeout(tryRender, 30);
  }
};
tryRender();
</script>

<script type="text/babel" data-presets="react" src="tweaks-panel.jsx"></script>
<script type="text/babel" data-presets="react" src="dashboards.jsx"></script>

<script>
  // Fit-to-viewport scaler for the 1440x900 stage
  (function(){
    const scaler = document.getElementById('scaler');
    function fit(){
      const w = window.innerWidth;
      const h = window.innerHeight;
      const s = Math.min(w/1440, h/900);
      scaler.style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>

</body>
</html>
